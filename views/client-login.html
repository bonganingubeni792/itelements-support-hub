<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Elements - Access Workspace Portal</title>
    <style>
        body { background-color: #0d0d0d; color: #e0e0e0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; text-align: center; }
        .navbar { background-color: #141414; border-bottom: 2px solid #222; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; max-width: 1100px; margin: 0 auto 35px auto; border-radius: 6px; }
        .nav-brand { font-size: 20px; font-weight: bold; color: #ffffff; letter-spacing: 0.5px; }
        .nav-links a { color: #b3b3b3; text-decoration: none; font-size: 14px; margin-left: 20px; font-weight: bold; }
        .nav-links a:hover { color: #ffffff; }
        .login-box { background-color: #141414; border: 1px solid #222; border-radius: 8px; padding: 40px 30px; width: 100%; max-width: 420px; margin: 80px auto 0 auto; box-shadow: 0 4px 15px rgba(0,0,0,0.6); box-sizing: border-box; }
        .top-description { color: #666; font-size: 13px; line-height: 1.6; margin-bottom: 25px; }
        .form-group { text-align: left; margin-bottom: 22px; position: relative; }
        .form-label { font-size: 12px; font-weight: bold; color: #ffffff; letter-spacing: 0.5px; margin-bottom: 10px; display: block; text-transform: uppercase; }
        .form-input { background-color: #ffffdd; color: #111111; border: 2px solid #1a73e8; padding: 14px; border-radius: 6px; width: 100%; font-size: 16px; font-weight: bold; box-sizing: border-box; }
        .form-input:focus { outline: none; box-shadow: 0 0 8px rgba(26,115,232,0.4); }
        
        .password-wrapper { position: relative; width: 100%; }
        .toggle-login-eye { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #555; cursor: pointer; font-size: 12px; font-weight: bold; text-transform: uppercase; user-select: none; }
        .toggle-login-eye:hover { color: #1a73e8; }

        .submit-btn { background-color: #1a73e8; color: white; border: none; padding: 15px; width: 100%; border-radius: 6px; font-size: 14px; font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px; cursor: pointer; margin-top: 10px; transition: background 0.2s; }
        .submit-btn:hover { background-color: #155cb4; }
        .link-footer { font-size: 13px; color: #666; margin-top: 20px; line-height: 1.8; }
        .link-footer a { color: #1a73e8; text-decoration: none; }
        .link-footer a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-brand">IT Elements.client-hub</div>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/pricing">Plans</a>
            <a href="/register">Register Account</a>
        </div>
    </nav>

    <div class="login-box">
        <form action="/client/login" method="POST">
            <div class="top-description">Enter your registered account details to access your self-help cockpit center.</div>

            <div class="form-group">
                <label class="form-label">Registered Email Address:</label>
                <input type="email" name="email" id="login-email" class="form-input" placeholder="sylakaura@gmail.com" required>
            </div>

            <div class="form-group">
                <label class="form-label">Account Password:</label>
                <div class="password-wrapper">
                    <input type="password" name="password" id="login-password" class="form-input" placeholder="••••••••••••••" required>
                    <button type="button" class="toggle-login-eye" onclick="toggleLoginPassword()">Show</button>
                </div>
            </div>

            <button type="submit" class="submit-btn">Unlock Technical Workspace</button>

            <div class="link-footer">
                <a href="#" onclick="handleForgotPasswordTrigger()">Forgot Password? Reset Here →</a><br>
                New subscriber? <a href="/register">Create an account here →</a>
            </div>
        </form>
    </div>

    <script>
        function toggleLoginPassword() {
            const passwordInput = document.getElementById('login-password');
            const toggleButton = document.querySelector('.toggle-login-eye');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleButton.innerText = 'Hide';
            } else {
                passwordInput.type = 'password';
                toggleButton.innerText = 'Show';
            }
        }

        function handleForgotPasswordTrigger() {
            const emailInput = document.getElementById('login-email').value.trim();
            if (!emailInput) {
                alert("Please type your registered email address into the Email box first, then click Reset!");
                return;
            }
            
            alert("A temporary password override link configuration has been generated for: " + emailInput + "\n\nAn automated dispatch transmission message has been forwarded down to your email inbox directory successfully.");
            window.location.href = "mailto:" + emailInput + "?subject=IT Elements Support - Password Reset Recovery Request&body=Hello,\n\nWe received a request to override access credentials mapping for your account profile layout. Click the network path link below to finalize configurations:\n\nhttps://itelements.help\n\nRegards,\nIT Elements Autonomous Framework Node Engine Layer";
        }
    </script>
</body>
</html>
