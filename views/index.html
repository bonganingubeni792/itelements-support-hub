<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Elements - On-Demand Remote Support</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #0b0c10;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 1000px;
            margin-bottom: 40px;
        }

        .logo-container {
            display: flex;
            align-items: center;
        }

        .logo-wrapper {
            display: inline-block;
            position: relative;
            width: 32px;
            height: 32px;
            margin-right: 12px;
            vertical-align: middle;
        }

        .logo-ring {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: #ff1a1a;
            border: 2px solid transparent;
            border-top-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            transform: rotate(-45deg);
        }

        .logo-inner-text {
            color: #ffffff;
            font-size: 0.75rem;
            font-weight: 900;
            font-style: italic;
            font-family: 'Georgia', serif;
            transform: rotate(45deg);
        }

        .logo-text {
            font-size: 1.4rem;
            font-weight: 900;
        }

        .logo-text span {
            color: #ff1a1a;
        }

        nav {
            display: flex;
            align-items: center;
        }

        nav a {
            color: #ffffff;
            text-decoration: none;
            margin-left: 20px;
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.2s;
        }

        nav a:hover {
            color: #ff1a1a;
        }

        .hero-section {
            text-align: center;
            max-width: 800px;
            margin-bottom: 50px;
        }

        .hero-section h1 {
            font-size: 3rem;
            font-weight: 900;
            margin-bottom: 20px;
            line-height: 1.2;
        }

        .hero-section p {
            color: #aaaaaa;
            font-size: 1.1rem;
            line-height: 1.6;
        }

        .compact-nav-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            width: 100%;
            max-width: 1000px;
            margin-bottom: 50px;
        }

        .compact-box {
            background-color: #121318;
            border: 1px solid #22252a;
            border-radius: 8px;
            padding: 22px 20px;
            text-align: center;
            text-decoration: none;
            color: #ffffff;
            transition: border-color 0.2s, transform 0.2s;
        }

        .compact-box:hover {
            border-color: #ff1a1a;
            transform: translateY(-2px);
        }

        .compact-box h3 {
            font-size: 1.1rem;
            font-weight: 800;
            color: #ff1a1a;
            margin-bottom: 8px;
        }

        .compact-box p {
            color: #aaaaaa;
            font-size: 0.85rem;
            line-height: 1.4;
        }

        .hourly-section {
            width: 100%;
            max-width: 1000px;
            background-color: #121318;
            border: 2px solid #ff1a1a;
            border-radius: 12px;
            padding: 35px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-bottom: 40px;
        }

        .hourly-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .hourly-header h2 {
            font-size: 1.6rem;
            font-weight: 900;
            margin-bottom: 5px;
            color: #ffffff;
        }

        .hourly-header p {
            color: #888888;
            font-size: 0.9rem;
        }

        .calculator-interface {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #0b0c10;
            border: 1px solid #22252a;
            padding: 25px;
            border-radius: 8px;
        }

        .selector-side {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 50%;
            text-align: left;
        }

        .selector-side label {
            font-size: 0.9rem;
            font-weight: bold;
            color: #cccccc;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
        }

        .custom-select {
            width: 100%;
            padding: 14px;
            background-color: #121318;
            border: 1px solid #333;
            color: #ffffff;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            outline: none;
        }

        .custom-select:focus {
            border-color: #ff1a1a;
        }

        .pricing-side {
            text-align: right;
            width: 45%;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 15px;
        }

        .price-display {
            font-size: 1.8rem;
            font-weight: 800;
            color: #ffffff;
        }

        .price-display span {
            color: #ff1a1a;
        }

        .hourly-pay-btn {
            padding: 14px 28px;
            background-color: #ff1a1a;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: background-color 0.2s;
        }

        .hourly-pay-btn:hover {
            background-color: #cc0000;
        }

        .status-section {
            width: 100%;
            max-width: 1000px;
            background-color: #121318;
            border: 1px solid #22252a;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 40px;
        }

        .status-title {
            font-size: 1.2rem;
            font-weight: 800;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #ffffff;
        }

        .status-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        .status-box {
            background-color: #0b0c10;
            border: 1px solid #22252a;
            padding: 18px;
            border-radius: 6px;
            text-align: left;
        }

        .status-label {
            font-size: 11px;
            color: #718096;
            text-transform: uppercase;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .status-value {
            font-size: 14px;
            font-weight: bold;
            color: #ffffff;
        }

        .status-value.green {
            color: #25d366;
        }

        footer {
            width: 100%;
            max-width: 1000px;
            border-top: 1px solid #1a202c;
            padding-top: 25px;
            margin-top: 20px;
            text-align: center;
            font-size: 0.9rem;
            color: #718096;
            line-height: 1.6;
        }

        footer strong {
            color: #ffffff;
        }

        /* 🟢 PIXEL-PERFECT WHATSAPP WIDGET STYLING */
        .whatsapp-floating-widget {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background-color: #25d366;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            cursor: pointer;
            z-index: 9999;
            transition: transform 0.2s, background-color 0.2s;
            border: none;
            outline: none;
        }

        .whatsapp-floating-widget:hover {
            transform: scale(1.06);
            background-color: #20ba5a;
        }

        .whatsapp-svg-raw {
            width: 32px;
            height: 32px;
            display: block;
        }

        /* 📱 PHONE ALIGNMENT MEDIA QUERIES LAYER */
        @media (max-width: 768px) {
            body { padding: 25px 15px; }
            header { flex-direction: column; gap: 20px; text-align: center; margin-bottom: 30px; }
            nav { justify-content: center; flex-wrap: wrap; gap: 10px; }
            nav a { margin: 0 10px; font-size: 0.9rem; }
            
            .hero-section h1 { font-size: 2.2rem; }
            .hero-section p { font-size: 1rem; }
            
            .compact-nav-grid { grid-template-columns: 1fr; gap: 15px; margin-bottom: 35px; }
            .compact-box { padding: 20px; }
            
            .hourly-section { padding: 20px; margin-bottom: 30px; }
            .calculator-interface { flex-direction: column; gap: 20px; padding: 15px; }
            .selector-side { width: 100%; }
            .pricing-side { width: 100%; text-align: center; align-items: center; }
            
            .status-section { padding: 20px; }
            .status-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
            
            footer { font-size: 0.85rem; }
