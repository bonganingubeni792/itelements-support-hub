<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Elements - On-Demand Remote Support</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #0b0c10;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 1000px;
            margin-bottom: 60px;
        }

        .logo-container {
            display: flex;
            align-items: center;
        }

        .logo-wrapper {
            display: inline-block;
            position: relative;
            width: 32px;
            height: 32px;
            margin-right: 12px;
            vertical-align: middle;
        }

        .logo-ring {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: #ff1a1a;
            border: 2px solid transparent;
            border-top-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            transform: rotate(-45deg);
        }

        .logo-inner-text {
            color: #ffffff;
            font-size: 0.75rem;
            font-weight: 900;
            font-style: italic;
            font-family: 'Georgia', serif;
            transform: rotate(45deg);
        }

        .logo-text {
            font-size: 1.4rem;
            font-weight: 900;
        }

        .logo-text span {
            color: #ff1a1a;
        }

        nav a {
            color: #ffffff;
            text-decoration: none;
            margin-left: 20px;
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.2s;
        }

        nav a:hover {
            color: #ff1a1a;
        }

        .hero-section {
            text-align: center;
            max-width: 800px;
            margin-bottom: 50px;
        }

        .hero-section h1 {
            font-size: 3rem;
            font-weight: 900;
            margin-bottom: 20px;
            line-height: 1.2;
        }

        .hero-section p {
            color: #aaaaaa;
            font-size: 1.1rem;
            line-height: 1.6;
        }

        .compact-nav-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            width: 100%;
            max-width: 1000px;
            margin-bottom: 50px;
        }

        .compact-box {
            background-color: #121318;
            border: 1px solid #22252a;
            border-radius: 8px;
            padding: 22px 20px;
            text-align: center;
            text-decoration: none;
            color: #ffffff;
            transition: border-color 0.2s, transform 0.2s;
        }

        .compact-box:hover {
            border-color: #ff1a1a;
            transform: translateY(-2px);
        }

        .compact-box h3 {
            font-size: 1.1rem;
            font-weight: 800;
            color: #ff1a1a;
            margin-bottom: 8px;
        }

        .compact-box p {
            color: #aaaaaa;
            font-size: 0.85rem;
            line-height: 1.4;
        }

        .hourly-section {
            width: 100%;
            max-width: 1000px;
            background-color: #121318;
            border: 2px solid #ff1a1a;
            border-radius: 12px;
            padding: 35px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .hourly-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .hourly-header h2 {
            font-size: 1.6rem;
            font-weight: 900;
            margin-bottom: 5px;
        }

        .hourly-header p {
            color: #888888;
            font-size: 0.9rem;
        }

        .calculator-interface {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #0b0c10;
            border: 1px solid #22252a;
            padding: 25px;
            border-radius: 8px;
        }

        .selector-side {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 45%;
        }

        .selector-side label {
            font-size: 0.9rem;
            font-weight: bold;
            color: #cccccc;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .custom-select {
            width: 100%;
            padding: 14px;
            background-color: #121318;
            border: 1px solid #333;
            color: #ffffff;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            outline: none;
        }

        .custom-select:focus {
            border-color: #ff1a1a;
        }

        .pricing-side {
            text-align: right;
            width: 45%;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
        }

        .price-display {
            font-size: 1.7rem;
            font-weight: 800;
            color: #ffffff;
        }

        .price-display span {
            color: #ff1a1a;
        }

        .hourly-pay-btn {
            padding: 12px 24px;
            background-color: #ff1a1a;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: background-color 0.2s;
        }

        .hourly-pay-btn:hover {
            background-color: #cc0000;
        }

        /* 🏦 PROPRIETARY CUSTOM DARK THEME MODAL DESIGN WINDOW */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }
        .modal-window {
            background-color: #121318;
            border: 2px solid #ff1a1a;
            border-radius: 12px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 40px rgba(255, 26, 26, 0.15);
            overflow: hidden;
            animation: modalFadeIn 0.3s ease;
        }
        @keyframes modalFadeIn {
            from { transform: translateY(-20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .modal-header {
            background-color: #1a1b23;
            padding: 20px;
            border-bottom: 1px solid #22252a;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-header h2 {
            font-size: 1.25rem;
            color: #ffffff;
            font-weight: 800;
        }
        .close-modal-x {
            color: #888888;
            font-size: 1.5rem;
            cursor: pointer;
            background: none;
            border: none;
        }
        .close-modal-x:hover { color: #ff1a1a; }
        .modal-body {
            padding: 25px;
            font-size: 0.95rem;
            line-height: 1.6;
        }
        .bank-details-grid {
            background-color: #0b0c10;
            border: 1px solid #22252a;
            border-radius: 6px;
            padding: 15px;
            margin: 15px 0;
        }
        .bank-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid #14161d;
        }
        .bank-row:last-child { border-bottom: none; }
        .bank-label { color: #888888; font-weight: 500; }
        .bank-value { color: #ffffff; font-weight: bold; font-family: monospace; }
        .warning-footer-notice {
            background-color: rgba(255, 26, 26, 0.08);
            border-left: 4px solid #ff1a1a;
            padding: 12px;
            border-radius: 0 6px 6px 0;
            font-size: 0.85rem;
            color: #cccccc;
            margin-top: 15px;
        }
        .modal-action-btn {
            width: 100%;
            padding: 14px;
            background-color: #25d366;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }
        .modal-action-btn:hover { background-color: #1ebe57; }

        @media (max-width: 768px) {
            .compact-nav-grid { grid-template-columns: 1fr; }
            .calculator-interface { flex-direction: column; align-items: stretch; gap: 25px; }
            .selector-side, .pricing-side { width: 100%; }
            .pricing-side { align-items: stretch; text-align: center; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <div class="logo-wrapper">
                <div class="logo-ring">
                    <span class="logo-inner-text">it</span>
                </div>
            </div>
            <h2 class="logo-text">IT Elements<span>.support</span></h2>
        </div>
        <nav>
            <a href="/">Home</a>
