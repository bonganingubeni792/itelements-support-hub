<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Elements - On-Demand Remote Support</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0b0c10; color: #ffffff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 40px 20px; }
        header { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 1000px; margin-bottom: 40px; }
        .logo-container { display: flex; align-items: center; }
        .logo-wrapper { display: inline-block; position: relative; width: 32px; height: 32px; margin-right: 12px; vertical-align: middle; }
        .logo-ring { width: 100%; height: 100%; border-radius: 50%; background: #ff1a1a; border: 2px solid transparent; border-top-color: #ffffff; display: flex; justify-content: center; align-items: center; transform: rotate(-45deg); }
        .logo-inner-text { color: #ffffff; font-size: 0.75rem; font-weight: 900; font-style: italic; font-family: 'Georgia', serif; transform: rotate(45deg); }
        .logo-text { font-size: 1.4rem; font-weight: 900; }
        .logo-text span { color: #ff1a1a; }
        nav { display: flex; align-items: center; }
        nav a { color: #ffffff; text-decoration: none; margin-left: 20px; font-size: 0.95rem; font-weight: 500; }
        .hourly-section { width: 100%; max-width: 1000px; background-color: #121318; border: 2px solid #ff1a1a; border-radius: 12px; padding: 35px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); margin-bottom: 40px; }
        .calculator-interface { display: flex; align-items: center; justify-content: space-between; background-color: #0b0c10; border: 1px solid #22252a; padding: 25px; border-radius: 8px; }
        .selector-side { display: flex; flex-direction: column; gap: 10px; width: 50%; text-align: left; }
        .selector-side label { font-size: 0.9rem; font-weight: bold; color: #cccccc; text-transform: uppercase; margin-bottom: 5px; }
        .custom-select { width: 100%; padding: 14px; background-color: #121318; border: 1px solid #333; color: #ffffff; font-size: 1rem; font-weight: bold; border-radius: 6px; }
        .pricing-side { text-align: right; width: 45%; display: flex; flex-direction: column; align-items: flex-end; gap: 15px; }
        .price-display { font-size: 1.8rem; font-weight: 800; color: #ffffff; }
        .price-display span { color: #ff1a1a; }
        .hourly-pay-btn { padding: 14px 28px; background-color: #ff1a1a; color: white; border: none; border-radius: 6px; font-size: 0.9rem; font-weight: bold; cursor: pointer; text-transform: uppercase; }
    </style>
    <!-- 💳 Load the secure inline popup script module library -->
    <script src="https://paystack.co"></script>
</head>
<body>
    <header>
        <div class="logo-container">
            <div class="logo-wrapper"><div class="logo-ring"><span class="logo-inner-text">it</span></div></div>
            <h2 class="logo-text">IT Elements<span>.support</span></h2>
        </div>
        <nav><a href="/">Home</a><a href="/pricing">Plans</a><a href="/support">Request Help</a><a href="/client/login">Portal</a></nav>
    </header>

    <div class="hourly-section">
        <div class="calculator-interface">
            <div class="selector-side">
                <label>Select Duration Allocation:</label>
                <select id="hoursSelector" class="custom-select" onchange="document.getElementById('calculatedPrice').innerText = String(parseInt(this.value) * 350);">
                    <option value="1">1 Hour Dedicated Support</option>
                    <option value="2">2 Hours Support Package</option>
                    <option value="3">3 Hours Network Overhaul</option>
                    <option value="4">4 Hours Corporate Deep-Clean</option>
                    <option value="5">5 Hours Complete Enterprise Care</option>
                </select>
            </div>
            <div class="pricing-side">
                <div class="price-display">R<span id="calculatedPrice">350</span></div>
                <button class="hourly-pay-btn" onclick="payWithPaystackInline()">Pay via Paystack 💳</button>
            </div>
        </div>
    </div>

    <script>
        function payWithPaystackInline() {
            var hours = document.getElementById("hoursSelector").value;
            var amountZAR = parseInt(hours) * 350;
            var referenceCode = "ITE-HOURLY-" + Math.floor(100000 + Math.random() * 900000);

            var handler = PaystackPop.setup({
                key: 'pk_test_131c4a5b9ffb6f4e8ea6fa6f4bcbb59015c6ed43b', 
                email: 'customer@itelements.help',
                amount: amountZAR * 100, 
                currency: 'ZAR',
                ref: referenceCode,
                callback: async function(response) {
                    alert("✅ Payment Successful! Reference: " + response.reference);
                    await fetch('/api/bookings/hourly', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ hours: hours, amount: amountZAR, reference: response.reference })
                    });
                    window.location.reload();
                }
            });
            handler.openIframe();
        }
    </script>
</body>
</html>
