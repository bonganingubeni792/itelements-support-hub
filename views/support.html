<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Remote Connection Support Ticket</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0b0c10; color: #ffffff; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .ticket-card { background-color: #121318; border: 1px solid #22252a; padding: 40px; border-radius: 12px; width: 100%; max-width: 500px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .title { font-size: 1.5rem; font-weight: 900; margin-bottom: 8px; text-align: center; }
        .title span { color: #ff1a1a; }
        .subtitle { color: #888888; font-size: 0.9rem; margin-bottom: 30px; text-align: center; }
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; font-size: 0.85rem; font-weight: bold; color: #aaaaaa; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
        .input-group input, .input-group textarea { width: 100%; padding: 14px; background-color: #0b0c10; border: 1px solid #22252a; border-radius: 6px; color: #ffffff; font-size: 0.95rem; transition: border-color 0.2s; }
        .input-group input:focus, .input-group textarea:focus { outline: none; border-color: #ff1a1a; }
        .input-group textarea { resize: none; height: 120px; }
        .row-split { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .submit-btn { width: 100%; padding: 16px; background: linear-gradient(135deg, #ff1a1a 0%, #b30000 100%); color: #ffffff; border: none; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; box-shadow: 0 4px 15px rgba(255, 26, 26, 0.2); margin-top: 10px; transition: transform 0.2s; }
        .submit-btn:hover { transform: translateY(-1px); }
        .back-link { text-align: center; margin-top: 20px; font-size: 0.85rem; }
        .back-link a { color: #888888; text-decoration: none; }
        .back-link a:hover { color: #ffffff; }
    </style>
</head>
<body>

    <div class="ticket-card">
        <div class="title">🚨 Dispatch <span>Support Request</span></div>
        <p class="subtitle">Provide your remote access token credentials to connect to your computer.</p>
        
        <form action="/support" method="POST">
            <div class="input-group">
                <label>Your Full Name</label>
                <input type="text" name="name" required placeholder="Bongani Ngubeni">
            </div>

            <div class="input-group">
                <label>Corporate E-mail Address</label>
                <input type="email" name="email" required placeholder="bongani@itelements.co.za">
            </div>

            <div class="row-split">
                <div class="input-group">
                    <label>AnyDesk / TV ID</label>
                    <input type="text" name="remoteId" required placeholder="123 456 789">
                </div>
                <div class="input-group">
                    <label>Remote Password</label>
                    <input type="text" name="remotePassword" required placeholder="abc1234">
                </div>
            </div>

            <div class="input-group">
                <label>Describe the Problem / Error Symptoms</label>
                <textarea name="issue" required placeholder="My printer network configurations are showing layout errors..."></textarea>
            </div>

            <button type="submit" class="submit-btn">Transmit Ticket to Queue</button>
        </form>

        <div class="back-link">
            <a href="/dashboard">◀ Cancel and Return to Workspace</a>
        </div>
    </div>

</body>
</html>
