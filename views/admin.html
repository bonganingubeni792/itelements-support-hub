<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>IT Elements - Admin Core Deck</title>
    <style>
        body { background-color: #0d0d0d; color: #e0e0e0; font-family: sans-serif; padding: 20px; }
        .dashboard-card { background: #141414; border: 1px solid #222; padding: 20px; border-radius: 6px; }
        .ticket-card { border-bottom: 1px solid #2d2d2d; padding: 15px 0; font-size: 14px; }
        .ticket-title { color: #4da6ff; font-weight: bold; }
        .ticket-meta { color: #ff4d4d; font-family: monospace; background: #222; padding: 2px 6px; border-radius: 4px; }
    </style>
</head>
<body>

    <h1>🔴 IT Elements Administration Console</h1>
    
    <div class="dashboard-card">
        <h3>🔴 Priority Engineering Escalation Queue</h3>
        <div id="tickets-container">
            <p>Querying cloud datacenter channels...</p>
        </div>
    </div>

    <script>
        async function loadTickets() {
            try {
                const response = await fetch('/api/tickets');
                const tickets = await response.json();
                const container = document.getElementById('tickets-container');
                container.innerHTML = '';

                if (tickets.length === 0) {
                    container.innerHTML = '<p>🎉 No open support tickets found.</p>';
                    return;
                }

                tickets.forEach(ticket => {
                    container.innerHTML += `
                        <div class="ticket-card">
                            <p class="ticket-title">📌 Client: ${ticket.name} (${ticket.email})</p>
                            <p><strong>AnyDesk / Connection ID:</strong> <span class="ticket-meta">${ticket.remoteId}</span></p>
                            <p><strong>Passkey Pin:</strong> <span class="ticket-meta" style="color:#ffcc00">${ticket.remotePassword}</span></p>
                            <p><strong>Reported Failure / Issue:</strong> ${ticket.issue}</p>
                            <p><strong>Work State Status:</strong> <span style="color:#ff3333; font-weight:bold;">${ticket.status || 'Open'}</span></p>
                        </div>
                    `;
                });
            } catch (err) {
                document.getElementById('tickets-container').innerHTML = '<p style="color:red">❌ Connection Interrupted.</p>';
            }
        }
        window.addEventListener('DOMContentLoaded', loadTickets);
    </script>
</body>
</html>
