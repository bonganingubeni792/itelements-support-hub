<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const queueBody=$('priority-queue-body'),historyBody=$('history-ledger-body'),activeSubBody=$('active-subscribers-body'),inactiveSubBody=$('canceled-subscribers-body'),onsiteBody=$('onsite-requests-body'),reviewsBody=$('customer-reviews-body');
  const searchInput=$('ticket-search'),statusFilter=$('ticket-status-filter'),toast=$('toast'),ticketPageSize=$('ticket-page-size'),historyPageSize=$('history-page-size'),ticketListCount=$('ticket-list-count'),historyListCount=$('history-list-count');
  let tickets=[],subscribers=[],inactiveUsers=[],toastTimer,knownNotificationIds=new Set(),firstNotificationLoad=true;
  function announce(message){toast.textContent=message;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),2300)}
  function showMessage(container,message,isError=false){container.replaceChildren();const el=document.createElement('div');el.className=isError?'error-text':'empty-text';el.textContent=message;container.appendChild(el)}
  function makeCell(className,value){const el=document.createElement('div');el.className=`cell ${className||''}`.trim();el.textContent=value==null||value===''?'—':String(value);return el}
  async function copyText(value,label){if(!value)return announce(`No ${label} was provided.`);try{await navigator.clipboard.writeText(String(value));announce(`${label} copied.`)}catch(_){const t=document.createElement('textarea');t.value=String(value);t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();const ok=document.execCommand('copy');t.remove();announce(ok?`${label} copied.`:'Copy failed.')}}
  function addCredentialCell(row,value,label){const cell=document.createElement('div');cell.className='cell';const display=document.createElement('span');display.className='credential-value';display.textContent=value?'••••••••':'Not provided';const reveal=document.createElement('button');reveal.type='button';reveal.className='copy-btn';reveal.textContent='◉';reveal.disabled=!value;reveal.title='Reveal or hide';reveal.addEventListener('click',()=>{const hidden=display.textContent==='••••••••';display.textContent=hidden?String(value):'••••••••';reveal.textContent=hidden?'Hide':'◉'});const copy=document.createElement('button');copy.type='button';copy.className='copy-btn';copy.textContent='Copy';copy.disabled=!value;copy.addEventListener('click',()=>copyText(value,label));const controls=document.createElement('div');controls.className='copy-list';controls.append(reveal,copy);cell.append(display,controls);row.appendChild(cell)}
  function appendTicketConversation(container,ticket){const details=document.createElement('details');details.className='ticket-conversation';const summary=document.createElement('summary');summary.textContent=`Conversation (${Array.isArray(ticket.messages)?ticket.messages.length:0})`;details.appendChild(summary);const thread=document.createElement('div');thread.className='ticket-thread';for(const msg of(Array.isArray(ticket.messages)?ticket.messages:[])){const item=document.createElement('article');item.className='ticket-message';const heading=document.createElement('strong');heading.textContent=msg.name||(msg.sender==='admin'?'IT Elements Support':'Customer');const time=document.createElement('time');time.textContent=msg.date?new Date(msg.date).toLocaleString():'';const body=document.createElement('p');body.textContent=msg.body||'';item.append(heading,time,body);thread.appendChild(item)}if(!thread.children.length){const empty=document.createElement('p');empty.className='note';empty.textContent='No replies yet.';thread.appendChild(empty)}const form=document.createElement('form');form.className='ticket-reply-form';const area=document.createElement('textarea');area.required=true;area.minLength=2;area.maxLength=2000;area.placeholder='Reply to the customer (no passwords or payment details)…';const error=document.createElement('p');error.className='ticket-reply-error';const send=document.createElement('button');send.type='submit';send.textContent='Send Customer Reply';form.append(area,error,send);form.addEventListener('submit',async e=>{e.preventDefault();send.disabled=true;error.textContent='';try{const response=await fetch(`/api/admin/tickets/${encodeURIComponent(ticket._id)}/messages`,{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({message:area.value})});const result=await response.json();if(!response.ok||!result.success)throw new Error(result.message||'Could not send reply.');ticket.messages=result.messages;appendTicketConversation(container,ticket);details.remove()}catch(err){error.textContent=err.message||'Could not send reply.';send.disabled=false}});details.append(thread,form);container.appendChild(details)}
  function makeTicketRow(ticket,isHistory){const row=document.createElement('div');row.className='data-row';row.appendChild(makeCell('client-name',ticket.name||'N/A'));const idCell=document.createElement('div');idCell.className='cell';idCell.appendChild(makeCell('mono',ticket.remoteId||'Not provided'));const copyId=document.createElement('button');copyId.type='button';copyId.className='copy-btn';copyId.textContent='Copy ID';copyId.disabled=!ticket.remoteId;copyId.addEventListener('click',()=>copyText(ticket.remoteId,'Remote ID'));idCell.appendChild(copyId);row.appendChild(idCell);addCredentialCell(row,ticket.remotePassword,'session key');const issue=makeCell('',ticket.issue||'No issue description');row.appendChild(issue);if(ticket.confirmedVisitAt){const appt=document.createElement('small');appt.style.cssText='display:block;color:#9bd5ff;margin-top:4px';appt.textContent=`${ticket.requestType==='onsite'?'Visit':'Session'}: ${new Date(ticket.confirmedVisitAt).toLocaleString('en-ZA')}${ticket.requestType==='onsite'?` · Fee R${Number(ticket.callOutFee||0).toFixed(2)}`:''}`;issue.appendChild(appt)}appendTicketConversation(issue,ticket);
    const statusCell=document.createElement('div');statusCell.className='cell';const status=ticket.status||'Open';const badge=document.createElement(status==='Resolved'?'button':'span');if(status==='Resolved'){badge.type='button';badge.title='Click to reopen';badge.addEventListener('click',()=>updateTicketStatus(ticket._id,'Open',badge))}badge.className=`status-badge ${status==='Resolved'?'badge-resolved':status==='On Hold'?'badge-onhold':status==='Session Confirmed'?'badge-confirmed':'badge-open'}`;badge.textContent=status==='Resolved'?'RESOLVED · REOPEN':status;statusCell.appendChild(badge);row.appendChild(statusCell);
    const actions=document.createElement('div');actions.className='cell action-list';const actionNames=isHistory?[['Open','Reopen']]:status==='On Hold'?[['Open','Unhold'],['Resolved','Resolve']]:[['Contacted','Contact'],...(status==='Session Confirmed'?[]:[['Session Confirmed','Confirm Session']]),['On Hold','Hold'],['Resolved','Resolve']];for(const[next,label]of actionNames){const btn=document.createElement('button');btn.type='button';btn.className=`action-btn ${next==='Resolved'?'btn-resolve':next==='On Hold'?'btn-hold':next==='Contacted'?'btn-contacted':isHistory?'btn-reopen':'btn-unhold'}`;btn.textContent=label;btn.addEventListener('click',()=>{if(next!=='Session Confirmed')return updateTicketStatus(ticket._id,next,btn);const suggested=ticket.preferredDate?`${ticket.preferredDate}T${ticket.preferredTime||'09:00'}`:'';const agreed=window.prompt('Enter agreed remote session date and time (YYYY-MM-DDTHH:mm):',suggested);if(!agreed)return;const date=new Date(agreed);if(Number.isNaN(date.getTime())||date<=new Date())return announce('Enter a valid future date and time.');updateTicketStatus(ticket._id,next,btn,{confirmedVisitAt:date.toISOString()})});actions.appendChild(btn)}row.appendChild(actions);return row}
  function renderTickets(){queueBody.replaceChildren();historyBody.replaceChildren();onsiteBody.replaceChildren();const query=searchInput.value.trim().toLowerCase(),filter=statusFilter.value;const onsite=tickets.filter(t=>t.requestType==='onsite'||String(t.issue||'').startsWith('ON-SITE SUPPORT ENQUIRY'));const matchingOnsite=onsite.filter(t=>{const s=t.status||'Open',txt=[t.name,t.email,t.phone,t.area,t.serviceType,t.preferredDate,t.issue].join(' ').toLowerCase();const ok=filter==='all'||(filter==='active'?!['Completed','Resolved'].includes(s):filter==='Resolved'?['Resolved','Completed'].includes(s):s===filter);return(!query||txt.includes(query))&&ok});
    for(const ticket of matchingOnsite){const card=document.createElement('article');card.className='onsite-request';const person=document.createElement('div');const name=document.createElement('h3');name.textContent=ticket.name||'Customer';person.appendChild(name);const email=document.createElement(ticket.email?'a':'p');email.textContent=ticket.email||'Email not provided';if(ticket.email){email.href=`mailto:${ticket.email}`;email.style.color='#b9d8f8'}person.appendChild(email);const phone=document.createElement(ticket.phone?'a':'p');phone.textContent=ticket.phone||'Phone not provided';if(ticket.phone){phone.href=`tel:${String(ticket.phone).replace(/[^+\\d]/g,'')}`;phone.style.display='block';phone.style.color='#b9d8f8'}person.appendChild(phone);
      const location=document.createElement('div');const ll=document.createElement('p');ll.className='field-label';ll.textContent='Area / Time';const lv=document.createElement('p');lv.textContent=`${ticket.area||'Area not provided'} · ${ticket.preferredDate||'Flexible date'} ${ticket.preferredTime||''}`;location.append(ll,lv);if(ticket.confirmedVisitAt){const c=document.createElement('p');c.className='confirmed-visit';c.textContent=`Confirmed: ${new Date(ticket.confirmedVisitAt).toLocaleString('en-ZA')} · Call-out fee R${Number(ticket.callOutFee||0).toFixed(2)}`;location.appendChild(c)}
      const service=document.createElement('div');const sl=document.createElement('p');sl.className='field-label';sl.textContent='Service';const sv=document.createElement('p');sv.textContent=ticket.serviceType||'On-site assessment';service.append(sl,sv);const issue=document.createElement('div');const il=document.createElement('p');il.className='field-label';il.textContent='Issue';const iv=document.createElement('p');iv.textContent=ticket.issue||'No details provided';issue.append(il,iv);
      const controls=document.createElement('div');const status=ticket.status||'Open';const badge=document.createElement('span');badge.className=`status-badge ${['Resolved','Completed'].includes(status)?'badge-resolved':status==='On Hold'?'badge-onhold':status==='Visit Confirmed'?'badge-confirmed':status==='Contacted'?'badge-contacted':'badge-open'}`;badge.textContent=status;controls.appendChild(badge);const actions=document.createElement('div');actions.className='action-list';actions.style.marginTop='8px';const options=['Resolved','Completed'].includes(status)?[['Open','Reopen']]:status==='On Hold'?[['Open','Unhold'],['Resolved','Close']]:status==='Open'?[['Contacted','Contact'],['On Hold','Hold'],['Resolved','Close']]:status==='Contacted'?[['On Hold','Hold'],['Resolved','Close']]:[['Completed','Completed'],['On Hold','Hold'],['Resolved','Close']];for(const[next,label]of options){const btn=document.createElement('button');btn.type='button';btn.className=`action-btn ${['Resolved','Completed'].includes(next)?'btn-resolve':next==='On Hold'?'btn-hold':next==='Open'?'btn-unhold':'btn-contacted'}`;btn.textContent=label;btn.addEventListener('click',()=>updateTicketStatus(ticket._id,next,btn));actions.appendChild(btn)}controls.appendChild(actions);card.append(person,location,service,issue,controls);
      if(!['Resolved','Completed'].includes(status)){const form=document.createElement('form');form.className='visit-confirm-form';const dateObj=ticket.confirmedVisitAt?new Date(ticket.confirmedVisitAt):null;const dateValue=dateObj?`${dateObj.getFullYear()}-${String(dateObj.getMonth()+1).padStart(2,'0')}-${String(dateObj.getDate()).padStart(2,'0')}`:ticket.preferredDate||'';const timeValue=dateObj?`${String(dateObj.getHours()).padStart(2,'0')}:${String(dateObj.getMinutes()).padStart(2,'0')}`:ticket.preferredTime||'';const fields=[['Agreed visit date','date',dateValue],['Agreed visit time','time',timeValue],['Call-out fee (R)','number',ticket.callOutFee==null?'':String(ticket.callOutFee)]];const inputs=[];for(const[label,type,value]of fields){const wrap=document.createElement('label');wrap.textContent=label;const input=document.createElement('input');input.type=type;input.value=value;input.required=true;if(type==='number'){input.min='0';input.step='0.01'}wrap.appendChild(input);form.appendChild(wrap);inputs.push(input)}const confirm=document.createElement('button');confirm.type='submit';confirm.className='action-btn btn-contacted';confirm.textContent='Confirm Visit';form.appendChild(confirm);form.addEventListener('submit',e=>{e.preventDefault();const when=new Date(`${inputs[0].value}T${inputs[1].value}`);if(Number.isNaN(when.getTime())||when<=new Date())return announce('Choose a future appointment date and time.');updateTicketStatus(ticket._id,'Visit Confirmed',confirm,{confirmedVisitAt:when.toISOString(),callOutFee:Number(inputs[2].value)})});card.appendChild(form)}onsiteBody.appendChild(card)}
    if(!onsiteBody.children.length)showMessage(onsiteBody,'No on-site enquiries match this filter.');
    const normal=tickets.filter(t=>!(t.requestType==='onsite'||String(t.issue||'').startsWith('ON-SITE SUPPORT ENQUIRY'))).filter(t=>!query||[t.name,t.email,t.remoteId,t.preferredDate,t.preferredTime,t.issue].join(' ').toLowerCase().includes(query));const active=normal.filter(t=>!['Resolved','Completed'].includes(t.status||'Open')&&(filter==='all'||filter==='active'||(t.status||'Open')===filter));const resolved=normal.filter(t=>['Resolved','Completed'].includes(t.status||'Open')&&(filter==='all'||filter==='active'||filter==='Resolved'||(t.status||'Open')===filter));const visibleA=ticketPageSize.value==='all'?active:active.slice(0,Number(ticketPageSize.value)),visibleR=historyPageSize.value==='all'?resolved:resolved.slice(0,Number(historyPageSize.value));visibleA.forEach(t=>queueBody.appendChild(makeTicketRow(t,false)));visibleR.forEach(t=>historyBody.appendChild(makeTicketRow(t,true)));ticketListCount.textContent=`Showing ${visibleA.length} of ${active.length}`;historyListCount.textContent=`Showing ${visibleR.length} of ${resolved.length}`;if(!queueBody.children.length)showMessage(queueBody,'No tickets match this filter.');if(!historyBody.children.length)showMessage(historyBody,'No resolved tickets match this filter.');$('side-ticket-count').textContent=String(active.length)}
  function renderUsers(container,users,active){container.replaceChildren();if(!users.length)return showMessage(container,active?'No active subscribers found.':'No inactive accounts recorded.');for(const user of users){const row=document.createElement('div');row.className='subscriber-row';row.appendChild(makeCell('client-name',user.fullName||'N/A'));row.appendChild(makeCell('',user.email||'—'));row.appendChild(makeCell('',user.phone||'—'));row.appendChild(makeCell('',user.subscriptionTier||'None'));const expiry=user.subscriptionExpiresAt?new Date(user.subscriptionExpiresAt).toLocaleDateString():'—';row.appendChild(makeCell(active?'badge-active':'badge-expired',`${user.subscriptionStatus||'Inactive'}${active?` · until ${expiry}`:''}`));if(active){row.classList.add('has-actions');const cell=document.createElement('div');cell.className='cell';const btn=document.createElement('button');btn.type='button';btn.className='action-btn btn-reopen reset-plan-btn';btn.dataset.userId=user._id;btn.textContent='Reset Test Plan';btn.setAttribute('aria-label',`Reset test plan for ${user.fullName||user.email}`);cell.appendChild(btn);row.appendChild(cell)}container.appendChild(row)}}
  activeSubBody.addEventListener('click',async e=>{const btn=e.target.closest('.reset-plan-btn');if(!btn)return;if(!window.confirm('Reset this account to None (Unpaid) / Inactive? This will not delete payment history.'))return;btn.disabled=true;try{const response=await fetch('/api/admin/subscriptions/reset',{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({userId:btn.dataset.userId})});const result=await response.json();if(!response.ok||!result.success)throw new Error(result.message||'Could not reset plan.');announce('Account plan reset. Payment history was kept.');await loadAdminData()}catch(err){announce(err.message||'Could not reset plan.');btn.disabled=false}});
  async function updateTicketStatus(ticketId,newStatus,button,extra={}){button.disabled=true;try{const response=await fetch('/api/tickets/update-status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ticketId,newStatus,...extra})});const result=await response.json();if(!response.ok||!result.success)throw new Error(result.message||'Ticket update failed.');announce(`Ticket marked ${newStatus.toLowerCase()}.`);await loadAdminData()}catch(err){announce(err.message||'Ticket update failed.');button.disabled=false}}
  async function loadAdminData(){try{const[tr,or]=await Promise.all([fetch('/api/tickets',{headers:{Accept:'application/json'}}),fetch('/api/admin/overview-data',{headers:{Accept:'application/json'}})]);if(tr.redirected||or.redirected)return window.location.assign('/client/login');if(!tr.ok||!or.ok)throw new Error('Could not load admin data. Please sign in again or refresh.');tickets=await tr.json();const overview=await or.json();subscribers=overview.activeSubscribers||[];inactiveUsers=overview.inactiveUsers||[];const stats=overview.stats||{};$('stat-active-tickets').textContent=stats.activeTickets??0;$('stat-active-subs').textContent=stats.activeSubscribers??subscribers.length;$('stat-inactive-subs').textContent=stats.inactiveUsers??inactiveUsers.length;$('stat-total-revenue').textContent=new Intl.NumberFormat('en-ZA',{style:'currency',currency:'ZAR'}).format(stats.confirmedPlanRevenue||0);renderTickets();renderUsers(activeSubBody,subscribers,true);renderUsers(inactiveSubBody,inactiveUsers,false);loadCustomerReviews()}catch(err){showMessage(queueBody,err.message||'Could not load tickets.',true);showMessage(activeSubBody,'Could not load subscribers.',true);showMessage(inactiveSubBody,'Could not load accounts.',true);showMessage(historyBody,'Could not load ticket history.',true)}}
  async function loadCustomerReviews(){try{const response=await fetch('/api/admin/reviews',{headers:{Accept:'application/json'}});if(!response.ok)throw new Error('Could not load customer feedback.');const reviews=await response.json();reviewsBody.replaceChildren();if(!reviews.length)return showMessage(reviewsBody,'No feedback has been submitted yet.');for(const review of reviews){const card=document.createElement('article');card.className='review-item';const content=document.createElement('div');const heading=document.createElement('h3');heading.textContent=`${review.name||'Customer'} · ${'★'.repeat(Number(review.rating)||0)}${'☆'.repeat(5-(Number(review.rating)||0))}`;content.appendChild(heading);const meta=document.createElement('p');meta.textContent=`${review.email||'No email'} · ${review.date?new Date(review.date).toLocaleDateString():'Date unavailable'} · ${review.status||'Pending'}`;content.appendChild(meta);const message=document.createElement('p');message.textContent=review.message||'';content.appendChild(message);const actions=document.createElement('div');actions.className='review-actions';for(const[status,label]of(review.status==='Published'?[['Hidden','Hide from home']]:[['Published','Approve and publish'],['Hidden','Hide']])){const btn=document.createElement('button');btn.type='button';btn.className=`action-btn ${status==='Published'?'btn-resolve':'btn-hold'}`;btn.textContent=label;btn.addEventListener('click',async()=>{btn.disabled=true;try{const update=await fetch('/api/admin/reviews/update-status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({reviewId:review._id,status})});const result=await update.json();if(!update.ok||!result.success)throw new Error(result.message||'Could not update review.');announce(status==='Published'?'Review published on the home page.':'Review hidden.');loadCustomerReviews()}catch(err){announce(err.message);btn.disabled=false}});actions.appendChild(btn)}card.append(content,actions);reviewsBody.appendChild(card)}}catch(err){showMessage(reviewsBody,err.message||'Could not load customer feedback.',true)}}
  searchInput.addEventListener('input',renderTickets);statusFilter.addEventListener('change',renderTickets);ticketPageSize.addEventListener('change',renderTickets);historyPageSize.addEventListener('change',renderTickets);$('refresh-button').addEventListener('click',loadAdminData);
  const notificationList=$('notification-list'),notificationCount=$('notification-count'),permissionButton=$('notification-permission'),toggle=$('notification-toggle'),panel=$('notification-panel'),widget=$('notification-widget'),close=$('notification-close');
  function closePanel(){panel.hidden=true;toggle.setAttribute('aria-expanded','false')}
  toggle.addEventListener('click',()=>{const opening=panel.hidden;panel.hidden=!opening;toggle.setAttribute('aria-expanded',String(opening));if(opening)loadNotifications()});close.addEventListener('click',closePanel);document.addEventListener('click',e=>{if(!widget.contains(e.target))closePanel()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closePanel()});
  function formatDate(value){const date=new Date(value);return Number.isNaN(date.getTime())?'':date.toLocaleString()}
  async function loadNotifications(){try{const response=await fetch('/api/notifications',{headers:{Accept:'application/json'}});if(response.redirected||response.status===401)return window.location.assign('/client/login');if(!response.ok)throw new Error('Could not load notifications.');const result=await response.json(),items=Array.isArray(result.notifications)?result.notifications:[],unread=items.filter(item=>!item.read);notificationCount.textContent=String(unread.length);toggle.setAttribute('aria-label',`${unread.length} unread notifications`);notificationList.replaceChildren();if(!items.length){const empty=document.createElement('div');empty.className='notification-empty';empty.textContent='You’re all caught up. New tickets and customer messages will appear here.';notificationList.appendChild(empty)}for(const item of items){if(!firstNotificationLoad&&!knownNotificationIds.has(item.id)&&!item.read&&'Notification'in window&&Notification.permission==='granted')new Notification(item.title,{body:`${item.actorName}: ${item.body}`,tag:item.id});knownNotificationIds.add(item.id);const btn=document.createElement('button');btn.type='button';btn.className=`notification-item${item.read?'':' unread'}`;btn.dataset.notificationId=item.id;btn.dataset.ticketId=item.ticketId;const title=document.createElement('strong');title.textContent=item.title;const body=document.createElement('span');body.textContent=`${item.actorName}: ${item.body}`;const time=document.createElement('time');time.dateTime=item.createdAt;time.textContent=formatDate(item.createdAt);btn.append(title,body,time);notificationList.appendChild(btn)}firstNotificationLoad=false}catch(err){notificationList.replaceChildren();const msg=document.createElement('div');msg.className='notification-empty';msg.textContent=err.message;notificationList.appendChild(msg)}}
  notificationList.addEventListener('click',async e=>{const btn=e.target.closest('[data-notification-id]');if(!btn)return;await fetch(`/api/notifications/${encodeURIComponent(btn.dataset.notificationId)}/read`,{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});await loadNotifications();closePanel();$('tickets-section').scrollIntoView({behavior:'smooth',block:'start'});loadAdminData()});
  permissionButton.addEventListener('click',async()=>{if(!('Notification'in window)){announce('This browser does not support desktop notifications.');return}const permission=await Notification.requestPermission();permissionButton.textContent=permission==='granted'?'Alerts Enabled':'Enable alerts';announce(permission==='granted'?'Desktop alerts are enabled while this page is open.':'Notification permission was not granted.')});if('Notification'in window&&Notification.permission==='granted')permissionButton.textContent='Alerts Enabled';
  document.querySelectorAll('.side-nav a').forEach(link=>link.addEventListener('click',()=>{document.querySelectorAll('.side-nav a').forEach(a=>a.classList.remove('active'));link.classList.add('active')}));
  loadNotifications();setInterval(loadNotifications,20000);loadAdminData();setInterval(loadAdminData,30000);
})();
