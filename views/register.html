<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Your IT Elements Support Account</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0b0c10; color: #ffffff; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .form-card { background-color: #121318; border: 1px solid #22252a; padding: 40px; border-radius: 12px; width: 100%; max-width: 450px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; }
        .logo-title { font-size: 1.6rem; font-weight: 900; margin-bottom: 8px; color: #ffffff; }
        .logo-title span { color: #ff1a1a; }
        .subtitle { color: #888888; font-size: 0.9rem; margin-bottom: 30px; }
        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group label { display: block; font-size: 0.85rem; font-weight: bold; color: #aaaaaa; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
        .input-group input { width: 100%; padding: 14px; background-color: #0b0c10; border: 1px solid #22252a; border-radius: 6px; color: #ffffff; font-size: 0.95rem; transition: border-color 0.2s; }
        .input-group input:focus { outline: none; border-color: #ff1a1a; }
        .submit-btn { width: 100%; padding: 16px; background: linear-gradient(135deg, #ff1a1a 0%, #b30000 100%); color: #ffffff; border: none; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; box-shadow: 0 4px 15px rgba(255, 26, 26, 0.2); margin-top: 10px; transition: background 0.2s; }
        .submit-btn:hover { background: #cc0000; }
        .footer-link { margin-top: 25px; font-size: 0.85rem; color: #888888; }
        .footer-link a { color: #ff1a1a; text-decoration: none; font-weight: bold; }
        .footer-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="form-card">
        <div class="logo-title">🛡️ IT ELEMENTS<span>.HELP</span></div>
        <p class="subtitle">Create an official system account for priority SLA coverage.</p>
        
        <!-- FIXED: Action endpoint points directly to our valid server route /client/register -->
        <form action="/client/register" method="POST">
            <div class="input-group">
                <label>Full Corporate Name</label>
                <input type="text" name="fullName" required placeholder="John Doe">
            </div>
            
            <div class="input-group">
                <label>Contact Phone Number</label>
                <input type="tel" name="phone" required placeholder="060 618 1229">
            </div>

            <div class="input-group">
                <label>Email Address</label>
                <input type="email" name="email" required placeholder="name@company.co.za">
            </div>

            <div class="input-group">
                <label>Security Access Password</label>
                <input type="password" name="password" required placeholder="••••••••">
            </div>

            <button type="submit" class="submit-btn">Register Account</button>
        </form>

        <div class="footer-link">
            Already have a support contract? <a href="/client/login">Sign In Here</a>
        </div>
    </div>

</body>
</html>
