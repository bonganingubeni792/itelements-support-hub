<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Elements - Register Account</title>
    <style>
        body { background-color: #0d0d0d; color: #e0e0e0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .register-container { background-color: #141414; border: 1px solid #222; border-radius: 8px; padding: 40px; width: 100%; max-width: 450px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); box-sizing: border-box; }
        .brand-header { display: flex; justify-content: center; align-items: center; gap: 10px; margin-bottom: 5px; }
        .brand-header h2 { margin: 0; font-size: 22px; color: #ffffff; letter-spacing: 1px; }
        .brand-header span { color: #ff3333; }
        .sub-header { color: #666; font-size: 12px; margin-bottom: 30px; text-align: center; line-height: 1.5; }
        .form-group { text-align: left; margin-bottom: 20px; position: relative; }
        .form-label { font-size: 11px; font-weight: bold; color: #888; letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 8px; display: block; }
        .form-input { background-color: #0a0a0a; color: #ffffff; border: 1px solid #222; padding: 14px; border-radius: 4px; width: 100%; font-size: 14px; box-sizing: border-box; }
        .form-input:focus { outline: none; border-color: #ff3333; }
        
        /* Interactive Eye Toggle Component styles */
        .password-wrapper { position: relative; width: 100%; }
        .toggle-password-eye { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #555; cursor: pointer; font-size: 12px; font-weight: bold; text-transform: uppercase; user-select: none; }
        .toggle-password-eye:hover { color: #ff3333; }

        .submit-btn { background-color: #ff1111; color: white; border: none; padding: 14px; width: 100%; border-radius: 4px; font-size: 14px; font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px; cursor: pointer; margin-top: 10px; transition: background 0.2s; }
        .submit-btn:hover { background-color: #cc0000; }
        .footer-link { text-align: center; margin-top: 25px; font-size: 13px; color: #666; }
        .footer-link a { color: #ff3333; text-decoration: none; font-weight: bold; }
        .footer-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="register-container">
        <form action="/register" method="POST">
            <div class="brand-header">
                <h2>IT ELEMENTS<span>.HELP</span></h2>
            </div>
            <div class="sub-header">Create an official system account for priority SLA coverage.</div>

            <div class="form-group">
                <label class="form-label">Full Corporate Name</label>
                <input type="text" name="fullName" class="form-input" placeholder="John Doe" required>
            </div>

            <div class="form-group">
                <label class="form-label">Contact Phone Number</label>
                <input type="text" name="phone" class="form-input" placeholder="060 618 1229" required>
            </div>

            <div class="form-group">
                <label class="form-label">Email Address</label>
                <input type="email" name="email" class="form-input" placeholder="name@company.co.za" required>
            </div>

            <div class="form-group">
                <label class="form-label">Security Access Password</label>
                <div class="password-wrapper">
                    <input type="password" id="register-password" name="password" class="form-input" placeholder="••••••••" required>
                    <button type="button" class="toggle-password-eye" onclick="toggleRegisterPassword()">Show</button>
                </div>
            </div>

            <button type="submit" class="submit-btn">Register Account</button>

            <div class="footer-link">
                Already have a support contract? <a href="/client/login">Sign In Here</a>
            </div>
        </form>
    </div>

    <script>
        function toggleRegisterPassword() {
            const passwordInput = document.getElementById('register-password');
            const toggleButton = document.querySelector('.toggle-password-eye');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleButton.innerText = 'Hide';
            } else {
                passwordInput.type = 'password';
                toggleButton.innerText = 'Show';
            }
        }
    </script>
</body>
</html>
