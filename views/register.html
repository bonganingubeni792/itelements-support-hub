<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0d0d0d">
    <title>IT Elements - Register Account</title>
    <style>
        * { box-sizing:border-box; }
        body { background:#0d0d0d; color:#e0e0e0; font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif; margin:0; padding:20px; display:flex; justify-content:center; align-items:center; min-height:100vh; }
        .register-container { background:#141414; border:1px solid #222; border-radius:8px; padding:36px 32px; width:100%; max-width:470px; box-shadow:0 4px 15px rgba(0,0,0,.5); }
        .brand-header { display:flex; justify-content:center; align-items:center; gap:10px; margin-bottom:5px; }
        .brand-header h1 { margin:0; font-size:22px; color:#fff; letter-spacing:1px; }
        .brand-header span { color:#ff3333; }
        .sub-header { color:#888; font-size:13px; margin-bottom:26px; text-align:center; line-height:1.6; }
        .form-group { text-align:left; margin-bottom:18px; }
        .form-label { font-size:11px; font-weight:bold; color:#aaa; letter-spacing:.5px; text-transform:uppercase; margin-bottom:8px; display:block; }
        .form-input { background:#0a0a0a; color:#fff; border:1px solid #333; padding:13px 14px; border-radius:4px; width:100%; font-size:15px; }
        .form-input::placeholder { color:#69717c; }
        .form-input:focus { outline:2px solid #ff3333; outline-offset:1px; border-color:#ff3333; }
        .password-wrapper { position:relative; width:100%; }
        .password-wrapper .form-input { padding-right:75px; }
        .toggle-password { position:absolute; right:12px; top:50%; transform:translateY(-50%); background:none; border:0; color:#aaa; cursor:pointer; font-size:12px; font-weight:bold; text-transform:uppercase; }
        .toggle-password:hover { color:#ff3333; }
        .password-help { margin:7px 0 0; color:#818894; font-size:12px; line-height:1.5; }
        .password-match { min-height:18px; margin:6px 0 0; font-size:12px; color:#818894; }
        .password-match.good { color:#4dff4d; }.password-match.bad { color:#ff7777; }
        .submit-btn { background:#ff2222; color:#fff; border:0; padding:14px; width:100%; border-radius:4px; font-size:14px; font-weight:bold; text-transform:uppercase; letter-spacing:.5px; cursor:pointer; margin-top:8px; transition:background .2s; }
        .submit-btn:hover { background:#cc0000; }.submit-btn:disabled { opacity:.6; cursor:wait; }
        .footer-link { text-align:center; margin-top:22px; font-size:13px; color:#888; line-height:1.8; }
        .footer-link a { color:#ff5555; text-decoration:none; font-weight:bold; }.footer-link a:hover { text-decoration:underline; }
        .privacy-note { margin:16px 0 0; color:#66707c; font-size:11px; text-align:center; line-height:1.5; }
        @media(max-width:520px) { body { padding:12px; align-items:flex-start; } .register-container { margin:auto 0; padding:30px 20px; } }
    </style>
    <link rel="stylesheet" href="/assets/responsive.css?v=1">
    <link rel="stylesheet" href="/assets/theme.css?v=9">
</head>
<body>
    <main class="register-container">
        <form action="/client/register" method="POST" id="register-form">
            <div class="brand-header"><h1>IT ELEMENTS<span>.HELP</span></h1></div>
            <p class="sub-header">Create your client account to manage support requests and service plans.</p>

            <div class="form-group">
                <label class="form-label" for="full-name">Full name or company name</label>
                <input type="text" id="full-name" name="fullName" class="form-input" placeholder="IT Elements Support" autocomplete="name" minlength="2" maxlength="100" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="phone">Contact phone number</label>
                <input type="tel" id="phone" name="phone" class="form-input" placeholder="e.g. 060 618 1229" autocomplete="tel" inputmode="tel" minlength="7" maxlength="25" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="email">Email address</label>
                <input type="email" id="email" name="email" class="form-input" placeholder="name@company.co.za" autocomplete="email" maxlength="254" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="register-password">Create password</label>
                <div class="password-wrapper">
                    <input type="password" id="register-password" name="password" class="form-input" autocomplete="new-password" minlength="12" maxlength="256" required>
                    <button type="button" class="toggle-password" data-target="register-password" aria-pressed="false">Show</button>
                </div>
                <p class="password-help">Use at least 12 characters. Don’t reuse your AnyDesk or TeamViewer session key.</p>
            </div>

            <div class="form-group">
                <label class="form-label" for="confirm-password">Confirm password</label>
                <div class="password-wrapper">
                    <input type="password" id="confirm-password" class="form-input" autocomplete="new-password" minlength="12" maxlength="256" required>
                    <button type="button" class="toggle-password" data-target="confirm-password" aria-pressed="false">Show</button>
                </div>
                <p class="password-match" id="password-match" aria-live="polite"></p>
            </div>

            <button type="submit" class="submit-btn" id="submit-button">Create account</button>
            <p class="privacy-note">Your password is stored securely. We will never ask you to send it to a support engineer.</p>
            <div class="footer-link">Already have an account? <a href="/client/login">Sign in</a></div>
        </form>
    </main>

    <script>
        (() => {
            const form = document.getElementById('register-form');
            const password = document.getElementById('register-password');
            const confirmation = document.getElementById('confirm-password');
            const matchMessage = document.getElementById('password-match');
            const submitButton = document.getElementById('submit-button');

            document.querySelectorAll('.toggle-password').forEach(button => {
                button.addEventListener('click', () => {
                    const input = document.getElementById(button.dataset.target);
                    const show = input.type === 'password';
                    input.type = show ? 'text' : 'password';
                    button.textContent = show ? 'Hide' : 'Show';
                    button.setAttribute('aria-pressed', String(show));
                });
            });

            function updatePasswordMatch() {
                if (!confirmation.value) {
                    matchMessage.textContent = '';
                    matchMessage.className = 'password-match';
                    return;
                }
                const matches = password.value === confirmation.value;
                matchMessage.textContent = matches ? 'Passwords match.' : 'Passwords do not match.';
                matchMessage.className = 'password-match ' + (matches ? 'good' : 'bad');
            }
            password.addEventListener('input', updatePasswordMatch);
            confirmation.addEventListener('input', updatePasswordMatch);

            form.addEventListener('submit', event => {
                if (password.value.length < 12) {
                    event.preventDefault();
                    password.setCustomValidity('Use at least 12 characters.');
                    password.reportValidity();
                    password.addEventListener('input', () => password.setCustomValidity(''), { once:true });
                    return;
                }
                if (password.value !== confirmation.value) {
                    event.preventDefault();
                    confirmation.setCustomValidity('The passwords must match.');
                    confirmation.reportValidity();
                    confirmation.addEventListener('input', () => confirmation.setCustomValidity(''), { once:true });
                    return;
                }
                submitButton.disabled = true;
                submitButton.textContent = 'Creating account…';
            });
        })();
    </script>
</body>
</html>
