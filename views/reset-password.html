<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Choose a new password | IT Elements</title>
    <style>
        * { box-sizing:border-box; }
        body { margin:0; padding:20px; background:#0d0d0d; color:#e0e0e0; font:15px/1.6 'Segoe UI',Tahoma,sans-serif; text-align:center; }
        .navbar,.box { width:min(100%,1500px); margin-inline:auto; }
        .navbar { display:flex; justify-content:space-between; align-items:center; gap:16px; padding:15px 25px; background:#141414; border-bottom:2px solid #222; border-radius:6px; text-align:left; }
        .brand { display:flex; align-items:center; gap:9px; color:#fff; font-size:20px; font-weight:bold; text-decoration:none; }
        .brand img { width:46px; height:46px; object-fit:cover; border-radius:50%; border:2px solid #fff; box-shadow:0 0 0 2px rgba(255,255,255,.15); background:#fff; flex:none; }
        .navbar a:last-child { color:#4da6ff; text-decoration:none; }
        .box { max-width:440px; margin:70px auto; padding:35px 28px; background:#141414; border:1px solid #222; border-radius:8px; text-align:left; }
        h1 { margin:0 0 8px; color:#fff; font-size:24px; }
        p { color:#888; font-size:14px; }
        label { display:block; margin:20px 0 7px; color:#fff; font-size:12px; font-weight:bold; text-transform:uppercase; }
        input { width:100%; padding:13px; border:2px solid #1a73e8; border-radius:6px; background:#ffffdd; color:#111; font-size:16px; }
        button { width:100%; margin-top:20px; padding:14px; border:0; border-radius:6px; background:#1a73e8; color:#fff; font-weight:bold; text-transform:uppercase; cursor:pointer; }
        button:disabled { opacity:.65; cursor:wait; }
        .message { min-height:24px; margin-top:14px; color:#bbb; font-size:13px; }
        .message.error { color:#ff8585; }
        a { color:#4da6ff; }
        @media(max-width:560px) { body { padding:12px; } .navbar { align-items:flex-start; flex-direction:column; } .box { margin-top:40px; padding:28px 20px; } }
    .brand-support{color:#fff!important}</style>
    <link rel="stylesheet" href="/assets/responsive.css?v=1">
    <link rel="stylesheet" href="/assets/theme.css?v=1">
</head>
<body>
    <nav class="navbar"><a class="brand" href="/"><img src="/assets/itel-support-icon.png?v=3" alt="" width="32" height="32"><span>IT Elements.</span><span class="brand-support">support</span></a><a href="/client/login">Back to sign in</a></nav>
    <main class="box">
        <h1>Choose a new password</h1>
        <p>Use at least 12 characters. This reset link is one-time and expires after 15 minutes.</p>
        <form id="reset-form">
            <label for="password">New password</label>
            <input type="password" id="password" name="password" autocomplete="new-password" minlength="12" maxlength="256" required>
            <label for="confirm-password">Confirm new password</label>
            <input type="password" id="confirm-password" autocomplete="new-password" minlength="12" maxlength="256" required>
            <button type="submit" id="reset-button">Save new password</button>
        </form>
        <p class="message" id="message" role="status" aria-live="polite"></p>
        <p><a href="/client/login">Return to sign in</a></p>
    </main>
    <script>
        document.getElementById('reset-form').addEventListener('submit', async function (event) {
            event.preventDefault();
            const message = document.getElementById('message');
            const button = document.getElementById('reset-button');
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            if (password !== confirmPassword) {
                message.textContent = 'The passwords do not match.';
                message.className = 'message error';
                return;
            }
            const token = new URLSearchParams(window.location.search).get('token') || '';
            button.disabled = true;
            message.textContent = 'Saving your new password…';
            message.className = 'message';
            try {
                const response = await fetch('/api/auth/reset-password', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, password })
                });
                const result = await response.json();
                message.textContent = result.message || 'Please try again.';
                if (response.ok && result.success) {
                    message.className = 'message';
                    document.getElementById('reset-form').hidden = true;
                } else {
                    message.className = 'message error';
                    button.disabled = false;
                }
            } catch (_) {
                message.textContent = 'Could not contact the server. Please try again.';
                message.className = 'message error';
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
