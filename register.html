<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Enterprise Account | IT Elements Support</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        .form-group label {
            color: #ffffff;
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
        }

        .form-group input {
            width: 100% !important;
            padding: 14px !important;
            background-color: #1c1d22 !important;
            border: 2px solid #3a3a46 !important;
            border-radius: 8px !important;
            color: #ffffff !important;
            font-size: 1rem !important;
            display: block !important;
            margin-bottom: 5px !important;
            transition: all 0.2s ease;
        }

            .form-group input:focus {
                border-color: #e50914 !important;
                outline: none;
                background-color: #22232a !important;
            }

        .strength-meter-wrapper {
            height: 4px;
            width: 100%;
            background-color: #22232a;
            border-radius: 2px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .strength-meter-bar {
            height: 100%;
            width: 0%;
            background-color: #ef4444;
            transition: all 0.3s ease;
        }
    </style>
</head>
<body>

    <header style="display: flex; justify-content: space-between; align-items: center; padding: 15px 5%; background-color: #121214; border-bottom: 2px solid #2e2e38;">
        <div class="logo-container" style="display: flex; align-items: center; gap: 14px;">
            <svg class="logo-svg-emblem" viewBox="0 0 100 100" xmlns="http://w3.org" style="height: 40px; width: 40px; display: block;">
                <circle cx="50" cy="50" r="32" fill="#e50914" />
                <path d="M 50 10 A 40 40 0 1 1 24 82 A 35 35 0 1 0 50 20 Z" fill="#ffffff" />
            </svg>
            <div class="logo-text" style="font-size: 1.4rem; font-weight: 800; color: #ffffff;">IT Elements<span>.onboarding</span></div>
        </div>
        <nav>
            <a href="/">Home</a>
            <a href="/pricing">Plans</a>
            <a href="/admin/login">Back to Login</a>
        </nav>
    </header>

    <main class="container" style="max-width: 500px; padding-top: 30px; margin: 0 auto;">
        <section class="hero-section" style="padding: 10px 0; text-align: center;">
            <h1 style="font-size: 2.5rem; font-weight: 800; color: #fff; margin-bottom: 10px;">Enterprise Registration</h1>
            <p class="subtitle" style="color: #c5c6c7;">Initialize your corporate profile environment to align active support SLA parameters.</p>
        </section>

        <section class="form-wrapper" style="background-color: #16161a; border: 1px solid #222226; padding: 40px; border-radius: 12px; box-shadow: 0 15px 40px rgba(0,0,0,0.5);">
            <form action="/auth/register" method="POST" id="registrationForm">

                <div class="form-group">
                    <label for="fullName">AUTHORIZED OPERATOR NAME:</label>
                    <input type="text" id="fullName" name="fullName" placeholder="e.g., IT Elements" required>
                </div>

                <div class="form-group">
                    <label for="phone">SOUTH AFRICAN MOBILE HOTLINE:</label>
                    <input type="tel" id="phone" name="phone" placeholder="e.g., 060 618 1229" required>
                </div>

                <div class="form-group">
                    <label for="email">CORPORATE BUSINESS EMAIL:</label>
                    <input type="email" id="email" name="email" placeholder="name@company.co.za" required oninput="detectCorporateDomain(this)">
                </div>

                <div class="form-group">
                    <label for="company">REGISTERED ENTITY / COMPANY NAME:</label>
                    <input type="text" id="company" name="company" placeholder="e.g., IT Elements" required>
                </div>

                <div class="form-group" style="margin-bottom: 5px;">
                    <label for="password">SECURITY ACCESS PASSWORD:</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required oninput="evaluatePasswordStrength(this)">
                </div>

                <div class="strength-meter-wrapper">
                    <div id="strengthBar" class="strength-meter-bar"></div>
                </div>

                <button type="submit" class="submit-btn" style="width: 100%; padding: 16px; background-color: #e50914; color: white; border: none; font-weight: 700; border-radius: 8px; cursor: pointer; text-transform: uppercase;">Initialize Corporate Profile</button>
            </form>

            <p style="text-align: center; font-size: 0.9rem; color: #a0a0ab; margin-top: 25px;">
                Already registered? <a href="/admin/login" style="color: #e50914; text-decoration: none; font-weight: 600;">Sign in here →</a>
            </p>
        </section>
    </main>

    <script>
                function detectCorporateDomain(emailInput) {
                    var email = emailInput.value.trim();
                    var companyInput = document.getElementById('company');

                    if (email && email.indexOf('@') !== -1) {
                        var parts = email.split('@');
                        if (parts.length > 1) {
                            var domain = parts[1];
                            var domainParts = domain.split('.');
                            if (domainParts.length > 0) {
                                var companyNameRaw = domainParts[0];
                                var genericHosts = ['gmail', 'yahoo', 'outlook', 'hotmail', 'icloud', 'live', 'mail', 'ymail'];

                                if (companyNameRaw && !genericHosts.includes(companyNameRaw.toLowerCase())) {
                                    var formattedCompany = companyNameRaw.charAt(0).toUpperCase() + companyNameRaw.slice(1);
                                    if (companyInput) {
                                        companyInput.value = formattedCompany;
                                    }
                                }
                            }
                        }
                    }
                }

                function evaluatePasswordStrength(passwordInput) {
                    var pass = passwordInput.value;
                    var bar = document.getElementById('strengthBar');
                    var score = 0;

                    if (pass.length > 5) score += 25;
                    if (pass.match(/[A-Z]/)) score += 25;
                    if (pass.match(/[0-9]/)) score += 25;
                    if (pass.match(/[^A-Za-z0-9]/)) score += 25;

                    if (bar) {
                        bar.style.width = score + '%';
                        if (score <= 25) {
                            bar.style.backgroundColor = '#ef4444';
                        } else if (score <= 75) {
                            bar.style.backgroundColor = '#f59e0b';
                        } else {
                            bar.style.backgroundColor = '#10b981';
                        }
                    }
                }
    </script>

</body>
</html>
